<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cycling Computer</title>

<!-- PWA用の設定 -->
<link rel="manifest" href="./manifest.json">
<!-- iOS用のアイコンやアプリ化の設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyCycle">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .app {
        max-width: 700px;
        margin: auto;
        padding: 20px;
    }

    .status {
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        color: #aaa;
        margin-bottom: 20px;
    }

    .speed {
        font-size: 100px;
        font-weight: bold;
        line-height: 1;
        margin-top: 20px;
    }

    .unit {
        font-size: 25px;
        color: #aaa;
        margin-bottom: 30px;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .card {
        background: #222;
        border-radius: 15px;
        padding: 18px;
    }

    .label {
        color: #888;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .value {
        font-size: 32px;
        font-weight: bold;
    }

    button {
        margin-top: 25px;
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }

    #start {
        background: #1e90ff;
        color: white;
    }

    #reset {
        background: #444;
        color: white;
        margin-left: 10px;
    }

    /* ログ表示・JSON用の追加スタイル */
    .log-container {
        margin-top: 40px;
        background: #1a1a1a;
        border-radius: 15px;
        padding: 15px;
        text-align: left;
    }
    .log-title {
        font-size: 18px;
        font-weight: bold;
        color: #1e90ff;
        margin-bottom: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
    }
    .log-list {
        max-height: 200px;
        overflow-y: auto;
        font-size: 14px;
        color: #ccc;
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .log-item {
        padding: 8px 0;
        border-bottom: 1px solid #222;
        display: flex;
        justify-content: space-between;
    }
    .json-btn-container {
        margin-top: 15px;
        text-align: right;
    }
    #exportJson {
        margin-top: 0;
        padding: 8px 15px;
        font-size: 14px;
        background: #333;
        color: #1e90ff;
        border: 1px solid #1e90ff;
        border-radius: 6px;
    }
    #exportJson:active {
        background: #1e90ff;
        color: white;
    }
</style>
</head>

<body>

<div class="app">

    <div class="status">
        <span id="gps">GPS: OFF</span>
        <span id="battery">Battery: --</span>
    </div>

    <div class="speed" id="speed">0.0</div>
    <div class="unit">km/h</div>

    <div class="grid">

        <div class="card">
            <div class="label">DISTANCE</div>
            <div class="value" id="distance">0.00 km</div>
        </div>

        <div class="card">
            <div class="label">TIME</div>
            <div class="value" id="time">00:00:00</div>
        </div>

        <div class="card">
            <div class="label">AVG SPEED</div>
            <div class="value" id="avg">0.0 km/h</div>
        </div>

        <div class="card">
            <div class="label">MAX SPEED</div>
            <div class="value" id="max">0.0 km/h</div>
        </div>

    </div>

    <button id="start">START</button>
    <button id="reset">RESET</button>

    <!-- 走行ログを表示するエリア -->
    <div class="log-container">
        <div class="log-title">RIDE HISTORY (走行ログ)</div>
        <ul id="logList" class="log-list">
            <!-- ここにログが追加されます -->
        </ul>
        <!-- JSONファイル保存ボタンを追加 -->
        <div class="json-btn-container">
            <button id="exportJson">JSONとして保存</button>
        </div>
    </div>

</div>

<script>

let watchID = null;
let running = false;

let startTime = 0;
let elapsed = 0;

let lastPosition = null;
let distance = 0;
let maxSpeed = 0;

// 60fpsで滑らかに動かすための変数
let currentDisplaySpeed = 0; // 画面表示用の速度（補間用）
let targetSpeed = 0;         // GPSから取得した実際の速度値
let wakeLock = null;         // スリープ防止用オブジェクト

// 起動時にログを読み込み
window.addEventListener('load', () => {
    displayLogs();
    // ユーザーが画面を触ったときにもスリープ防止を起動できるようにする（iOS対策）
    document.body.addEventListener('click', requestWakeLock);
});

// 60fpsアニメーション描画ループ（ヌルヌル動かす心臓部）
function drawLoop() {
    if (!running) return;

    // 1. 時間の更新処理
    elapsed = Date.now() - startTime;
    const totalSeconds = Math.floor(elapsed / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    
    document.getElementById("time").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    // 2. 速度の60fps滑らか補間処理（ローパスフィルタ）
    currentDisplaySpeed += (targetSpeed - currentDisplaySpeed) * 0.1;
    
    // 0.05km/h未満のわずかなブレは0に丸める
    if (currentDisplaySpeed < 0.05) currentDisplaySpeed = 0;
    
    document.getElementById("speed").textContent = currentDisplaySpeed.toFixed(1);

    // 3. 平均速度の毎フレームリアルタイム計算
    if (elapsed > 0) {
        const hoursTotal = elapsed / 3600000;
        const avg = distance / hoursTotal;
        if (isFinite(avg)) {
            document.getElementById("avg").textContent = avg.toFixed(1) + " km/h";
        }
    }

    // 次のフレームに自分自身を呼び出す
    requestAnimationFrame(drawLoop);
}

// スリープ防止（Wake Lock API）
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            if (!wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('スリープ防止: 有効');
            }
        } catch (err) {
            console.log(`スリープ防止エラー: ${err.name}, ${err.message}`);
        }
    }
}

// スリープ防止解除
function releaseWakeLock() {
    if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
        console.log('スリープ防止: 解除');
    }
}

// START / PAUSE
document.getElementById("start").onclick = function() {
    if (!running) {
        running = true;
        document.getElementById("start").textContent = "PAUSE";
        startTime = Date.now() - elapsed;
        
        requestWakeLock();
        requestAnimationFrame(drawLoop);

        startGPS();
    } else {
        running = false;
        document.getElementById("start").textContent = "START";
        
        releaseWakeLock();

        if (watchID !== null) {
            navigator.geolocation.clearWatch(watchID);
        }
    }
};

// GPS開始
function startGPS() {
    if (!navigator.geolocation) {
        alert("この端末はGPSに対応していません。");
        return;
    }

    watchID = navigator.geolocation.watchPosition(
        function(position) {
            document.getElementById("gps").textContent = "GPS: OK";

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            let speed = position.coords.speed;

            if (speed !== null && !isNaN(speed)) {
                speed = speed * 3.6;
            } else {
                speed = 0;
            }

            // ターゲット速度を更新（描画ループ側で滑らかにする）
            targetSpeed = speed;

            if (speed > maxSpeed) {
                maxSpeed = speed;
                document.getElementById("max").textContent = maxSpeed.toFixed(1) + " km/h";
            }

            // 距離計算
            if (lastPosition !== null) {
                const d = calcDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                if (speed > 0.5) {
                    distance += d;
                }
                document.getElementById("distance").textContent = distance.toFixed(2) + " km";
            }

            lastPosition = { lat: lat, lon: lon };
        },
        function(error) {
            document.getElementById("gps").textContent = "GPS: ERROR";
            console.log(error);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 5000
        }
    );
}

// 距離計算
function calcDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

// 走行ログの保存処理
function saveLog() {
    if (distance === 0 && elapsed === 0) return;

    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    
    const totalSeconds = Math.floor(elapsed / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const timeStr = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    const hoursTotal = elapsed / 3600000;
    const avg = hoursTotal > 0 ? (distance / hoursTotal).toFixed(1) : "0.0";

    const newLog = {
        date: dateStr,
        dist: distance.toFixed(2),
        time: timeStr,
        max: maxSpeed.toFixed(1),
        avg: avg,
        timestamp: Date.now() // JSON管理用の一意のID
    };

    let logs = JSON.parse(localStorage.getItem('cycling_logs')) || [];
    logs.unshift(newLog);
